<!doctype html>
<!-- Hand-written to match the field structure GitHub rendered on 2026-10-18. Replace with a real snapshot. -->
<html><head><title>Actions</title></head><body>
<div role="dialog" aria-label="Run workflow">
  <form id="workflow_dispatch_form" action="/o/r/actions/manual" method="post" aria-label="Run workflow">
    <input type="hidden" name="workflow" value=".github/workflows/spike.yml">
    <input type="hidden" name="branch" value="main">
    <fieldset><input type="text" id="_r_h_" aria-label="Filter branches"></fieldset>
    <div><label for="_r_m_">[multiline] Release notes</label><input type="text" id="_r_m_" name="inputs[notes]"><span>notes</span></div>
    <div><label for="_r_n_">[options: branches] Branch</label><input type="text" id="_r_n_" name="inputs[target]" value="main"><span>target</span></div>
    <button type="submit">Run workflow</button>
  </form>
</div>
</body></html>

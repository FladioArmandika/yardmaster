<!doctype html>
<!-- Hand-written stand-in for GitHub's "Run workflow" panel. Replace with a real snapshot. -->
<html><head><title>Actions</title></head><body>
<details data-deferred-details-content-url="/o/r/actions/manual?workflow=.github%2Fworkflows%2Fspike.yml" open>
  <summary>Run workflow</summary>
  <form action="/o/r/actions/manual" method="post">
    <input type="hidden" name="workflow" value=".github/workflows/spike.yml">
    <input type="hidden" name="ref" value="main">
    <div class="form-group"><label for="notes">[multiline] Release notes</label><input type="text" id="notes" name="inputs[notes]"></div>
    <div class="form-group"><label for="target">[options: branches] Branch</label><input type="text" id="target" name="inputs[target]" value="main"></div>
    <button type="submit">Run workflow</button>
  </form>
</details>
</body></html>
